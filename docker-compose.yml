services:
  # =============== BANCO DE DADOS ===============
  product-db:
    image: postgres:17
    container_name: product-db
    env_file: ".env"
    restart: unless-stopped
    ports:
      - "${PRODUCT_DB_EXTERNAL_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 3s
      retries: 3
    expose:
      - "5432"
      - "3000"
    volumes:
      - product-db-volume:/var/lib/postgresql/data

  payment-db:
    image: postgres:17
    container_name: payment-db
    env_file: ".env"
    restart: unless-stopped
    ports:
      - "${PAYMENT_DB_EXTERNAL_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 3s
      retries: 3
    expose:
      - "5432"
      - "3001"
    volumes:
      - payment-db-volume:/var/lib/postgresql/data

  user-db:
    image: postgres:17
    container_name: user-db
    env_file: ".env"
    restart: unless-stopped
    ports:
      - "${USER_DB_EXTERNAL_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 3s
      retries: 3
    expose:
      - "5432"
      - "3002"
    volumes:
      - user-db-volume:/var/lib/postgresql/data

  order-db:
    image: mongo:8
    container_name: order-db
    env_file: ".env"
    restart: unless-stopped
    expose:
      - "5432"
      - "3003"
    ports:
      - "${ORDER_DB_EXTERNAL_PORT}:27017"
    volumes:
      - order-db-volume:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # =============== SERVICES ===============
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: notification-service
    env_file: ".env"
    ports:
      - "${NOTIFICATION_SERVICE_EXTERNAL_PORT}:${NOTIFICATION_SERVICE_PORT}"
    healthcheck:
      test: [ "CMD", "curl", "http://0.0.0.0:${NOTIFICATION_SERVICE_PORT}" ]
      interval: 5s
      timeout: 3s
      start_period: 5s
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    depends_on:
      order-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    container_name: order-service
    env_file: ".env"
    ports:
      - "${ORDER_SERVICE_EXTERNAL_PORT}:${ORDER_SERVICE_PORT}"
    healthcheck:
      test: [ "CMD", "curl", "http://0.0.0.0:${ORDER_SERVICE_PORT}/" ]
      interval: 5s
      timeout: 3s
      start_period: 5s

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    depends_on:
      payment-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    container_name: payment-service
    env_file: ".env"
    ports:
      - "${PAYMENT_SERVICE_EXTERNAL_PORT}:${PAYMENT_SERVICE_PORT}"
    healthcheck:
      test: [ "CMD", "curl", "http://0.0.0.0:${PAYMENT_SERVICE_PORT}/" ]
      interval: 5s
      timeout: 3s
      start_period: 5s

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    depends_on:
      product-db:
        condition: service_healthy
    restart: unless-stopped
    container_name: product-service
    env_file: ".env"
    ports:
      - "${PRODUCT_SERVICE_EXTERNAL_PORT}:${PRODUCT_SERVICE_PORT}"
    healthcheck:
      test: [ "CMD", "curl", "http://0.0.0.0:${PRODUCT_SERVICE_PORT}/" ]
      interval: 5s
      timeout: 3s
      start_period: 5s

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    depends_on:
      user-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    container_name: user-service
    env_file: ".env"
    ports:
      - "${USER_SERVICE_EXTERNAL_PORT}:${USER_SERVICE_PORT}"
    healthcheck:
      test: [ "CMD", "curl", "http://0.0.0.0:${USER_SERVICE_PORT}/" ]
      interval: 5s
      timeout: 3s
      start_period: 5s

  # =============== TESTES DE CARGA ===============
  influxdb:
    image: influxdb:1.8
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "${INFLUX_DB_EXTERNAL_PORT}:8086"
    environment:
      - INFLUXDB_DB=k6
      - INFLUXDB_HTTP_AUTH_ENABLED=false
    volumes:
      - influxdb_data:/var/lib/influxdb
      - ./influxdb-init/init-influxdb.sh:/docker-entrypoint-initdb.d/init-influxdb.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  grafana:
    image: grafana/grafana:10.2.3
    container_name: grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_EXTERNAL_PORT}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      influxdb:
        condition: service_healthy
    volumes:
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  k6:
    image: grafana/k6:latest
    container_name: k6
    volumes:
      - ./k6-scripts:/scripts
    environment:
    - K6_OUT=influxdb=influxdb:8086/k6-orders
    entrypoint: ["tail", "-f", "/dev/null"]
    depends_on:
      grafana:
        condition: service_healthy

  # =============== FILA RABBITMQ ===============
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    ports:
      - "${RABBITMQ_MQTP_EXTERNAL_PORT}:5672"
      - "${RABBITMQ_UI_EXTERNAL_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    depends_on:
      - kafka
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  rabbitmq-queue-orchestrator:
    build:
      context: ./rabbitmq-queue-orchestrator
      dockerfile: Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    container_name: rabbitmq-queue-orchestrator
    env_file: ".env"

  # =============== KAFKA ===============
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_EXTERNAL_PORT}:9094"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_EXTERNAL_PORT}
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'

  init-kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - kafka
    entrypoint: [ '/bin/sh', '-c' ]
    command: |
      "
      echo -e 'Aguardando Kafka ficar pronto...'
      kafka-topics --bootstrap-server kafka:9092 --list
      
      echo -e 'Criando tópicos kafka...'
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic orders   --replication-factor 1 --partitions 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic payments --replication-factor 1 --partitions 2

      echo -e 'Tópicos criados com sucesso:'
      kafka-topics --bootstrap-server kafka:9092 --list
      "

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "${KAFKA_UI_EXTERNAL_PORT}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kafka-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: 'true'

  # =============== CACHE ===============
  redis:
    image: redis:7.2
    container_name: redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # =============== GATEWAY ===============
  kong:
    image: kong:3.4
    container_name: kong
    restart: unless-stopped
    depends_on:
      - product-service
      - payment-service
      - order-service
      - user-service
      - rabbitmq
    volumes:
      - ./kong/kong.yml:/usr/local/kong/declarative/kong.yml
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_NGINX_HTTP_LUA_SHARED_DICT: "custom_cache 128m"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_STREAM_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_STREAM_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000
    ports:
      - "${KONG_PROXY_PORT}:8000"
      - "${KONG_ADMIN_PORT}:8001"

volumes:
  product-db-volume:
  payment-db-volume:
  user-db-volume:
  order-db-volume:
  influxdb_data:
  grafana_data:
  rabbitmq_data:
  redis_data:
    driver: local
