services:
  # === BANCO DE DADOS ===
  product-db:
    image: postgres:17
    container_name: product-db
    env_file: ".env"
    restart: unless-stopped
    ports:
      - "${PRODUCT_DB_EXTERNAL_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 3s
      retries: 3
    expose:
      - "5432"
      - "3000"
    volumes:
      - product-db-volume:/var/lib/postgresql/data

  payment-db:
    image: postgres:17
    container_name: payment-db
    env_file: ".env"
    restart: unless-stopped
    ports:
      - "${PAYMENT_DB_EXTERNAL_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 3s
      retries: 3
    expose:
      - "5432"
      - "3001"
    volumes:
      - payment-db-volume:/var/lib/postgresql/data

  user-db:
    image: postgres:17
    container_name: user-db
    env_file: ".env"
    restart: unless-stopped
    ports:
      - "${USER_DB_EXTERNAL_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 3s
      retries: 3
    expose:
      - "5432"
      - "3002"
    volumes:
      - user-db-volume:/var/lib/postgresql/data

  order-db:
    image: mongo:8
    container_name: order-db
    env_file: ".env"
    restart: unless-stopped
    expose:
      - "5432"
      - "3003"
    ports:
      - "${ORDER_DB_EXTERNAL_PORT}:27017"
    volumes:
      - order-db-volume:/data/db

  # === SERVICES ===
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: notification-service
    env_file: ".env"
    ports:
      - "${NOTIFICATION_SERVICE_EXTERNAL_PORT}:${NOTIFICATION_SERVICE_PORT}"
    healthcheck:
      test: [ "CMD", "curl", "http://0.0.0.0:${NOTIFICATION_SERVICE_PORT}" ]
      interval: 5s
      timeout: 3s
      start_period: 5s

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    depends_on:
      - order-db
    restart: unless-stopped
    container_name: order-service
    env_file: ".env"
    ports:
      - "${ORDER_SERVICE_EXTERNAL_PORT}:${ORDER_SERVICE_PORT}"
    healthcheck:
      test: [ "CMD", "curl", "http://0.0.0.0:${ORDER_SERVICE_PORT}/" ]
      interval: 5s
      timeout: 3s
      start_period: 5s

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    depends_on:
      payment-db:
        condition: service_healthy
    restart: unless-stopped
    container_name: payment-service
    env_file: ".env"
    ports:
      - "${PAYMENT_SERVICE_EXTERNAL_PORT}:${PAYMENT_SERVICE_PORT}"
    healthcheck:
      test: [ "CMD", "curl", "http://0.0.0.0:${PAYMENT_SERVICE_PORT}/" ]
      interval: 5s
      timeout: 3s
      start_period: 5s

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    depends_on:
      product-db:
        condition: service_healthy
    restart: unless-stopped
    container_name: product-service
    env_file: ".env"
    ports:
      - "${PRODUCT_SERVICE_EXTERNAL_PORT}:${PRODUCT_SERVICE_PORT}"
    healthcheck:
      test: [ "CMD", "curl", "http://0.0.0.0:${PRODUCT_SERVICE_PORT}/" ]
      interval: 5s
      timeout: 3s
      start_period: 5s

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    depends_on:
      user-db:
        condition: service_healthy
    restart: unless-stopped
    container_name: user-service
    env_file: ".env"
    ports:
      - "${USER_SERVICE_EXTERNAL_PORT}:${USER_SERVICE_PORT}"
    healthcheck:
      test: [ "CMD", "curl", "http://0.0.0.0:${USER_SERVICE_PORT}/" ]
      interval: 5s
      timeout: 3s
      start_period: 5s

  # === TESTES DE CARGA ===
  influxdb:
    image: influxdb:1.8
    container_name: influxdb
    restart: always
    ports:
      - "${INFLUX_DB_EXTERNAL_PORT}:8086"
    environment:
      - INFLUXDB_DB=k6
      - INFLUXDB_HTTP_AUTH_ENABLED=false
    volumes:
      - influxdb_data:/var/lib/influxdb
      - ./influxdb-init/init-influxdb.sh:/docker-entrypoint-initdb.d/init-influxdb.sh

  grafana:
    image: grafana/grafana:10.2.3
    container_name: grafana
    restart: always
    ports:
      - "${GRAFANA_EXTERNAL_PORT}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - influxdb
    volumes:
      - grafana_data:/var/lib/grafana

  k6:
    image: grafana/k6:latest
    container_name: k6
    volumes:
      - ./k6-scripts:/scripts
    environment:
    - K6_OUT=influxdb=influxdb:8086/k6-orders
    entrypoint: ["tail", "-f", "/dev/null"]
    depends_on:
      - influxdb
      - order-service
    # COMMAND: k6 run --out influxdb=http://influxdb:8086/k6-orders /scripts/order-load-test.js

volumes:
  product-db-volume:
  payment-db-volume:
  user-db-volume:
  order-db-volume:
  influxdb_data:
  grafana_data:
    driver: local
